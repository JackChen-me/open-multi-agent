name: OMA Maintainer Bot

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: oma-maintainer-${{ github.repository }}-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  activate:
    if: >-
      github.repository == 'open-multi-agent/open-multi-agent' &&
      github.event.label.name == 'agent-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the trusted workflow commit with read-only GITHUB_TOKEN
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Verify pinned npm version
        run: test "$(npm --version)" = "10.9.8"

      - name: Install locked dependencies before minting any App token
        run: npm ci --ignore-scripts

      - name: Build the deterministic host before minting any App token
        id: build-host
        run: npm run build -w @open-multi-agent/maintainer-host

      - name: Create repository-scoped Maintainer Bot App token
        id: app-token
        if: vars.OMA_MAINTAINER_BOT_APP_WRITER_ENABLED == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OMA_MAINTAINER_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.OMA_MAINTAINER_BOT_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: write
          permission-issues: write
          permission-metadata: read
          permission-pull-requests: write

      - name: Verify App, event snapshot, and triple-SHA identity; publish STARTED
        id: start
        if: steps.app-token.outcome == 'success'
        env:
          MAINTAINER_BOT_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          OMA_CLAIM_ID: ${{ github.run_id }}.${{ github.run_attempt }}
          OMA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OMA_APP_WRITER_ENABLED: ${{ vars.OMA_MAINTAINER_BOT_APP_WRITER_ENABLED }}
          OMA_EXPECTED_APP_ID: ${{ vars.OMA_MAINTAINER_BOT_APP_ID }}
          OMA_EXPECTED_APP_CLIENT_ID: ${{ vars.OMA_MAINTAINER_BOT_APP_CLIENT_ID }}
          OMA_EXPECTED_APP_SLUG: ${{ vars.OMA_MAINTAINER_BOT_APP_SLUG }}
          OMA_EXPECTED_APP_INSTALLATION_ID: ${{ vars.OMA_MAINTAINER_BOT_APP_INSTALLATION_ID }}
          OMA_EXPECTED_APP_BOT_USER_ID: ${{ vars.OMA_MAINTAINER_BOT_APP_BOT_USER_ID }}
          OMA_ACTUAL_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          OMA_ACTUAL_APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: >-
          node packages/maintainer-host/dist/cli.js start
          --event "$GITHUB_EVENT_PATH"
          --policy packages/maintainer-host/config/production-policy.json
          --repo "$GITHUB_WORKSPACE"
          --claim-id "$OMA_CLAIM_ID"
          --actions-run-id "$GITHUB_RUN_ID"
          --run-url "$OMA_RUN_URL"
          --workflow-sha "$GITHUB_WORKFLOW_SHA"
          --app-writer-enabled "$OMA_APP_WRITER_ENABLED"
          --expected-app-id "$OMA_EXPECTED_APP_ID"
          --expected-app-client-id "$OMA_EXPECTED_APP_CLIENT_ID"
          --expected-app-slug "$OMA_EXPECTED_APP_SLUG"
          --expected-app-installation-id "$OMA_EXPECTED_APP_INSTALLATION_ID"
          --expected-app-bot-user-id "$OMA_EXPECTED_APP_BOT_USER_ID"
          --app-slug "$OMA_ACTUAL_APP_SLUG"
          --app-installation-id "$OMA_ACTUAL_APP_INSTALLATION_ID"
          --start-out "$RUNNER_TEMP/oma-maintainer/start.json"

      - name: Recover typed start failure with the verified App
        id: start-recovery
        if: always() && steps.app-token.outcome == 'success' && steps.start.outcome != 'success'
        env:
          MAINTAINER_BOT_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          OMA_CLAIM_ID: ${{ github.run_id }}.${{ github.run_attempt }}
          OMA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OMA_FAILURE_STAGE: ${{ steps.start.outputs.failure_stage || 'output-write' }}
          OMA_FAILURE_DETAIL: ${{ steps.start.outputs.failure_detail || 'The typed start command failed before it could persist trusted failure outputs.' }}
          OMA_APP_WRITER_ENABLED: ${{ vars.OMA_MAINTAINER_BOT_APP_WRITER_ENABLED }}
          OMA_EXPECTED_APP_ID: ${{ vars.OMA_MAINTAINER_BOT_APP_ID }}
          OMA_EXPECTED_APP_CLIENT_ID: ${{ vars.OMA_MAINTAINER_BOT_APP_CLIENT_ID }}
          OMA_EXPECTED_APP_SLUG: ${{ vars.OMA_MAINTAINER_BOT_APP_SLUG }}
          OMA_EXPECTED_APP_INSTALLATION_ID: ${{ vars.OMA_MAINTAINER_BOT_APP_INSTALLATION_ID }}
          OMA_EXPECTED_APP_BOT_USER_ID: ${{ vars.OMA_MAINTAINER_BOT_APP_BOT_USER_ID }}
          OMA_ACTUAL_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          OMA_ACTUAL_APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: >-
          node packages/maintainer-host/dist/cli.js recover-start
          --event "$GITHUB_EVENT_PATH"
          --policy packages/maintainer-host/config/production-policy.json
          --claim-id "$OMA_CLAIM_ID"
          --actions-run-id "$GITHUB_RUN_ID"
          --run-url "$OMA_RUN_URL"
          --failure-stage "$OMA_FAILURE_STAGE"
          --failure-detail "$OMA_FAILURE_DETAIL"
          --app-writer-enabled "$OMA_APP_WRITER_ENABLED"
          --expected-app-id "$OMA_EXPECTED_APP_ID"
          --expected-app-client-id "$OMA_EXPECTED_APP_CLIENT_ID"
          --expected-app-slug "$OMA_EXPECTED_APP_SLUG"
          --expected-app-installation-id "$OMA_EXPECTED_APP_INSTALLATION_ID"
          --expected-app-bot-user-id "$OMA_EXPECTED_APP_BOT_USER_ID"
          --app-slug "$OMA_ACTUAL_APP_SLUG"
          --app-installation-id "$OMA_ACTUAL_APP_INSTALLATION_ID"

      - name: Publish non-authoritative App bootstrap or recovery failure
        id: bootstrap
        if: >-
          always() &&
          (steps.app-token.outcome != 'success' ||
          (steps.start.outcome != 'success' && steps.start-recovery.outcome != 'success'))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OMA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OMA_BOOTSTRAP_STAGE: ${{ steps.app-token.outcome != 'success' && 'app-token-mint' || 'app-identity-or-recovery' }}
        run: >-
          node packages/maintainer-host/dist/cli.js bootstrap-failure
          --event "$GITHUB_EVENT_PATH"
          --actions-run-id "$GITHUB_RUN_ID"
          --run-url "$OMA_RUN_URL"
          --stage "$OMA_BOOTSTRAP_STAGE"

      - name: Install Claude Code sandbox runtime dependencies
        if: steps.start.outcome == 'success' && steps.start.outputs.execution_backend == 'claude-code'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor bubblewrap socat
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = '1'
          sudo install --owner=root --group=root --mode=0644 \
            packages/maintainer-runtime/config/bwrap.apparmor \
            /etc/apparmor.d/bwrap
          sudo apparmor_parser --replace /etc/apparmor.d/bwrap
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = '1'

      - name: Install pinned Claude Code
        if: steps.start.outcome == 'success' && steps.start.outputs.execution_backend == 'claude-code'
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: |
          set -euo pipefail
          npm install --global @anthropic-ai/claude-code@2.1.220
          claude --version | grep -F '2.1.220'

      - name: Build and preflight the production Maintainer Runtime
        id: runtime
        if: steps.start.outcome == 'success' && steps.start.outputs.execution_backend == 'claude-code'
        shell: bash
        run: |
          set -euo pipefail
          npm run build -w @open-multi-agent/maintainer-runtime
          node packages/maintainer-runtime/dist/cli.js sandbox-preflight \
            --repo "$GITHUB_WORKSPACE"

      - name: Re-fetch, authorize, and establish the durable candidate claim
        id: prepare
        if: >-
          steps.start.outcome == 'success' &&
          (steps.start.outputs.execution_backend == 'legacy' || steps.runtime.outcome == 'success')
        env:
          MAINTAINER_BOT_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          OMA_APP_WRITER_ENABLED: ${{ vars.OMA_MAINTAINER_BOT_APP_WRITER_ENABLED }}
          OMA_EXPECTED_APP_ID: ${{ vars.OMA_MAINTAINER_BOT_APP_ID }}
          OMA_EXPECTED_APP_CLIENT_ID: ${{ vars.OMA_MAINTAINER_BOT_APP_CLIENT_ID }}
          OMA_EXPECTED_APP_SLUG: ${{ vars.OMA_MAINTAINER_BOT_APP_SLUG }}
          OMA_EXPECTED_APP_INSTALLATION_ID: ${{ vars.OMA_MAINTAINER_BOT_APP_INSTALLATION_ID }}
          OMA_EXPECTED_APP_BOT_USER_ID: ${{ vars.OMA_MAINTAINER_BOT_APP_BOT_USER_ID }}
          OMA_ACTUAL_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          OMA_ACTUAL_APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: >-
          node packages/maintainer-host/dist/cli.js prepare
          --start "$RUNNER_TEMP/oma-maintainer/start.json"
          --start-hash "${{ steps.start.outputs.start_hash }}"
          --event "$GITHUB_EVENT_PATH"
          --policy packages/maintainer-host/config/production-policy.json
          --repo "$GITHUB_WORKSPACE"
          --app-writer-enabled "$OMA_APP_WRITER_ENABLED"
          --expected-app-id "$OMA_EXPECTED_APP_ID"
          --expected-app-client-id "$OMA_EXPECTED_APP_CLIENT_ID"
          --expected-app-slug "$OMA_EXPECTED_APP_SLUG"
          --expected-app-installation-id "$OMA_EXPECTED_APP_INSTALLATION_ID"
          --expected-app-bot-user-id "$OMA_EXPECTED_APP_BOT_USER_ID"
          --app-slug "$OMA_ACTUAL_APP_SLUG"
          --app-installation-id "$OMA_ACTUAL_APP_INSTALLATION_ID"
          --activation-out "$RUNNER_TEMP/oma-maintainer/activation.json"

      - name: Run the selected OMA backend in a credential-isolated child process
        id: engine
        if: steps.prepare.outcome == 'success' && steps.prepare.outputs.should_run == 'true'
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          exec 3<<<"${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}"
          unset DEEPSEEK_API_KEY
          exec env -i \
            PATH="$PATH" \
            HOME="$HOME" \
            LANG="${LANG:-C.UTF-8}" \
            CI=1 \
            TMPDIR="$RUNNER_TEMP" \
            node packages/maintainer-host/dist/cli.js run-engine \
            --provider-key-fd 3 \
            --activation "$RUNNER_TEMP/oma-maintainer/activation.json" \
            --result-out "$RUNNER_TEMP/oma-maintainer/engine-result.json" \
            --state-dir "$RUNNER_TEMP/oma-maintainer/state" \
            --artifact-dir "$RUNNER_TEMP/oma-maintainer/artifacts" \
            --maintainer-bot-cli packages/maintainer-bot/dist/cli.js \
            --maintainer-runtime-cli packages/maintainer-runtime/dist/cli.js \
            --repo "$GITHUB_WORKSPACE"

      - name: Upload bounded OMA pipeline trace
        if: always() && steps.prepare.outputs.should_run == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maintainer-bot-trace-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oma-maintainer/artifacts/*.pipeline-trace.json
          if-no-files-found: warn
          retention-days: 7

      - name: Revalidate with the App and create at most one Draft PR
        id: finalize
        if: always() && steps.prepare.outcome == 'success'
        env:
          MAINTAINER_BOT_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          OMA_APP_WRITER_ENABLED: ${{ vars.OMA_MAINTAINER_BOT_APP_WRITER_ENABLED }}
          OMA_EXPECTED_APP_ID: ${{ vars.OMA_MAINTAINER_BOT_APP_ID }}
          OMA_EXPECTED_APP_CLIENT_ID: ${{ vars.OMA_MAINTAINER_BOT_APP_CLIENT_ID }}
          OMA_EXPECTED_APP_SLUG: ${{ vars.OMA_MAINTAINER_BOT_APP_SLUG }}
          OMA_EXPECTED_APP_INSTALLATION_ID: ${{ vars.OMA_MAINTAINER_BOT_APP_INSTALLATION_ID }}
          OMA_EXPECTED_APP_BOT_USER_ID: ${{ vars.OMA_MAINTAINER_BOT_APP_BOT_USER_ID }}
          OMA_ACTUAL_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          OMA_ACTUAL_APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: >-
          node packages/maintainer-host/dist/cli.js finalize
          --activation "$RUNNER_TEMP/oma-maintainer/activation.json"
          --engine-result "$RUNNER_TEMP/oma-maintainer/engine-result.json"
          --event "$GITHUB_EVENT_PATH"
          --policy packages/maintainer-host/config/production-policy.json
          --state-dir "$RUNNER_TEMP/oma-maintainer/state"
          --artifact-dir "$RUNNER_TEMP/oma-maintainer/artifacts"
          --repo "$GITHUB_WORKSPACE"
          --app-writer-enabled "$OMA_APP_WRITER_ENABLED"
          --expected-app-id "$OMA_EXPECTED_APP_ID"
          --expected-app-client-id "$OMA_EXPECTED_APP_CLIENT_ID"
          --expected-app-slug "$OMA_EXPECTED_APP_SLUG"
          --expected-app-installation-id "$OMA_EXPECTED_APP_INSTALLATION_ID"
          --expected-app-bot-user-id "$OMA_EXPECTED_APP_BOT_USER_ID"
          --app-slug "$OMA_ACTUAL_APP_SLUG"
          --app-installation-id "$OMA_ACTUAL_APP_INSTALLATION_ID"
          --final-out "$RUNNER_TEMP/oma-maintainer/final.json"

      - name: Recover App-authenticated control-plane failure
        id: recovery
        if: always() && steps.start.outcome == 'success' && steps.finalize.outcome != 'success'
        env:
          MAINTAINER_BOT_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          OMA_APP_WRITER_ENABLED: ${{ vars.OMA_MAINTAINER_BOT_APP_WRITER_ENABLED }}
          OMA_EXPECTED_APP_ID: ${{ vars.OMA_MAINTAINER_BOT_APP_ID }}
          OMA_EXPECTED_APP_CLIENT_ID: ${{ vars.OMA_MAINTAINER_BOT_APP_CLIENT_ID }}
          OMA_EXPECTED_APP_SLUG: ${{ vars.OMA_MAINTAINER_BOT_APP_SLUG }}
          OMA_EXPECTED_APP_INSTALLATION_ID: ${{ vars.OMA_MAINTAINER_BOT_APP_INSTALLATION_ID }}
          OMA_EXPECTED_APP_BOT_USER_ID: ${{ vars.OMA_MAINTAINER_BOT_APP_BOT_USER_ID }}
          OMA_ACTUAL_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          OMA_ACTUAL_APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: >-
          node packages/maintainer-host/dist/cli.js recover
          --event "$GITHUB_EVENT_PATH"
          --start "$RUNNER_TEMP/oma-maintainer/start.json"
          --start-hash "${{ steps.start.outputs.start_hash }}"
          --app-writer-enabled "$OMA_APP_WRITER_ENABLED"
          --expected-app-id "$OMA_EXPECTED_APP_ID"
          --expected-app-client-id "$OMA_EXPECTED_APP_CLIENT_ID"
          --expected-app-slug "$OMA_EXPECTED_APP_SLUG"
          --expected-app-installation-id "$OMA_EXPECTED_APP_INSTALLATION_ID"
          --expected-app-bot-user-id "$OMA_EXPECTED_APP_BOT_USER_ID"
          --app-slug "$OMA_ACTUAL_APP_SLUG"
          --app-installation-id "$OMA_ACTUAL_APP_INSTALLATION_ID"

      - name: Apply typed terminal exit policy
        if: always()
        env:
          OMA_TERMINAL_STATUS: ${{ steps.finalize.outputs.terminal_status || steps.recovery.outputs.terminal_status || steps.start-recovery.outputs.terminal_status || steps.bootstrap.outputs.terminal_status || 'FAILED' }}
        run: >-
          node packages/maintainer-host/dist/cli.js exit-terminal
          --status "$OMA_TERMINAL_STATUS"
