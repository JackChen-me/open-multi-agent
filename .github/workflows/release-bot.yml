name: OMA Release Bot

on:
  workflow_dispatch:
  schedule:
    # Friday 18:23 Asia/Taipei. The offset is intentionally documented because
    # GitHub schedules are UTC and can be delayed during high load. The :23
    # keeps the trigger off the top of the hour, the most contended slot: the
    # 2026-08-28 trigger was never delivered at all, not merely delayed.
    - cron: '23 10 * * 5'

permissions:
  contents: read

concurrency:
  group: oma-release-bot-main
  cancel-in-progress: false

jobs:
  prepare-release-pr:
    if: github.repository == 'open-multi-agent/open-multi-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create narrowly scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve GitHub App commit identity
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Configure auditable bot commit identity
        env:
          BOT_NAME: ${{ steps.app-user.outputs.name }}
          BOT_EMAIL: ${{ steps.app-user.outputs.email }}
        run: |
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"

      - name: Build the repository-local release bot
        run: npm run build -w @open-multi-agent/release-bot

      - name: Analyze merged changes and create a ready release PR
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RELEASE_BOT_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_BOT_MODEL: deepseek-v4-flash
        run: node packages/release-bot/dist/cli.js prepare-pr

      # A weekly job that fails only into the Actions tab is a job nobody reads.
      # Two consecutive Friday runs failed unnoticed before this step existed.
      # Uses the built-in token, so it needs no App permission or new secret.
      - name: Surface a failed run so the weekly cadence cannot fail silently
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Release bot run failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Filter the plain list rather than the search index, which lags far
          # enough behind creation to open a second issue for one incident.
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')
          body=$(printf '%s\n' \
            "The \`$TRIGGER\` release bot run did not finish." \
            "" \
            "- Run: $RUN_URL" \
            "- Commit: \`$COMMIT_SHA\`" \
            "" \
            "Open the failing step's log for the cause. A token-budget stop or a" \
            "skipped task now names itself on the \`OMA release analysis failed.\`" \
            "line rather than leaving it blank.")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi
